[build-system]
requires = [
    "hatchling",
]
build-backend = "hatchling.build"

[project]
name = "raglab"
version = "0.2.6"
description = "A medley of tools to make RAG-based applications."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
keywords = [
    "rag",
    "retrieval",
    "search-agent",
    "llm",
    "agents",
    "information-retrieval",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
authors = [
    { name = "thorwhalen" },
]
# raglab orchestrates retrieval via `ir` (the retrieval substrate). LLM
# strategies (Planner/Formulator/Evaluator) use `oa` lazily — the `llm` extra
# below — so `import raglab` stays offline by default.
dependencies = [
    "ir>=0.1.16",
]

[project.urls]
Homepage = "https://thorwhalen.github.io/raglab/"
Repository = "https://github.com/thorwhalen/raglab"
Documentation = "https://thorwhalen.github.io/raglab"
Issues = "https://github.com/thorwhalen/raglab/issues"
Changelog = "https://github.com/thorwhalen/raglab/blob/main/CHANGELOG.md"

[project.optional-dependencies]
llm = [
    "oa",
]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.1.0",
]
docs = [
    "sphinx>=6.0",
    "sphinx-rtd-theme>=1.0",
]

[tool.ruff]
line-length = 88
target-version = "py310"
exclude = [
    "**/*.ipynb",
    ".git",
    ".venv",
    "build",
    "dist",
    "tests",
    "examples",
    "scrap",
]

[tool.ruff.lint]
# Real lint rules from the start (pyflakes / pycodestyle / bugbear), not just
# docstring presence. E501 (line length) stays off — long descriptive docstrings.
select = [
    "D100",
    "F",
    "E",
    "W",
    "B",
]
ignore = [
    "D203",
    "E501",
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"**/tests/*" = [
    "D",
]
"**/examples/*" = [
    "D",
]
"**/scrap/*" = [
    "D",
]

[tool.pytest.ini_options]
minversion = "6.0"
testpaths = [
    "tests",
]
doctest_optionflags = [
    "NORMALIZE_WHITESPACE",
    "ELLIPSIS",
]

[tool.wads.ci]
project_name = ""

[tool.wads.ci.commands]
pre_test = []
test = []
post_test = []
lint = []
format = []

[tool.wads.ci.env]
required_envvars = []
test_envvars = []
extra_envvars = []

[tool.wads.ci.env.defaults]

[tool.wads.ci.quality.ruff]
enabled = true

[tool.wads.ci.quality.black]
enabled = false

[tool.wads.ci.quality.mypy]
enabled = false

[tool.wads.ci.testing]
enabled = true
python_versions = [
    "3.10",
    "3.12",
]
pytest_args = [
    "-v",
    "--tb=short",
]
coverage_enabled = true
coverage_threshold = 0
coverage_report_format = [
    "term",
    "xml",
]
exclude_paths = [
    "examples",
    "scrap",
]
test_on_windows = true

[tool.wads.ci.metrics]
enabled = true
config_path = ".github/umpyre-config.yml"
storage_branch = "code-metrics"
python_version = "3.10"
force_run = false

[tool.wads.ci.build]
sdist = true
wheel = true

[tool.wads.ci.publish]
enabled = true
skip_ci_marker = "[skip ci]"
publish_marker = "[publish]"

[tool.wads.ci.docs]
enabled = true
builder = "epythet"
ignore_paths = [
    "tests/",
    "scrap/",
    "examples/",
]
